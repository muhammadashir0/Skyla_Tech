<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="portrait-bg" x1="0" y1="0" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2f9ff"/>
      <stop offset="1" stop-color="#e1ecf3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#portrait-bg)"/>
  <!-- Stylized person silhouette -->
  <circle cx="300" cy="280" r="100" fill="#03283d" opacity="0.15"/>
  <ellipse cx="300" cy="500" rx="140" ry="180" fill="#03283d" opacity="0.15"/>
  <!-- Contour decoration -->
  <circle cx="300" cy="280" r="120" stroke="#00aa64" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="300" cy="280" r="140" stroke="#00aa64" stroke-width="1.5" fill="none" opacity="0.2"/>
  <text x="300" y="750" text-anchor="middle" font-family="Poppins, sans-serif" font-size="20" font-weight="600" fill="#03283d" opacity="0.5">Skyla Tech Team</text>
</svg>